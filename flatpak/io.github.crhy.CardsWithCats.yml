app-id: io.github.crhy.CardsWithCats
runtime: org.freedesktop.Platform
runtime-version: "25.08"
sdk: org.freedesktop.Sdk
command: CardsWithCats
separate-locales: false
finish-args:
  - --share=ipc
  - --socket=pulseaudio
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
modules:
  - name: cards-with-cats
    buildsystem: simple
    build-commands:
      - install -Dm755 -t /app/bin CardsWithCats
      - cp -r data /app/bin/data
      - cp -r lib /app/bin/lib
      - install -Dm644 io.github.crhy.CardsWithCats.desktop -t /app/share/applications/
      - install -Dm644 io.github.crhy.CardsWithCats.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 io.github.crhy.CardsWithCats.png /app/share/icons/hicolor/128x128/apps/io.github.crhy.CardsWithCats.png
    sources:
      - type: dir
        path: prebuilt
