plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
def hasReleaseKey = keystorePropertiesFile.exists()
if (hasReleaseKey) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.dozingcatsoftware.cardswithcats"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_24
        targetCompatibility = JavaVersion.VERSION_24
    }

    defaultConfig {
        applicationId = "com.dozingcatsoftware.cardswithcats"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    // Native dds double-dummy solver (see lib/bridge/dds_ffi.dart).
    externalNativeBuild {
        cmake {
            path = "CMakeLists.txt"
        }
    }

    signingConfigs {
        // Only defined if key.properties exists, so that builds which don't need it
        // (fdroid, debug) work without it.
        if (hasReleaseKey) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    // fdroid config from https://nikhiljha.com/posts/flutteronfdroid/
    // Had to add "std" flavor in order to build with default signing config.
    flavorDimensions "deploy"

    productFlavors {
        // Signing configs are set here rather than in buildTypes.release, because a build
        // type's signing config takes precedence over a flavor's and would make the fdroid
        // build try to sign with the release key. (Debug builds are unaffected: the debug
        // build type sets its own signing config, which wins over these.)
        std {
            dimension "deploy"
            if (hasReleaseKey) {
                // Change this to "signingConfigs.debug" to do a release build without
                // using production keys.
                signingConfig = signingConfigs.release
            }
        }

        // F-Droid builds the app and signs it with their own key, so no signing config
        // is set here and the built apk is left unsigned.
        fdroid {
            dimension "deploy"
        }
    }

    buildTypes {
        release {
            // Signing config comes from the product flavor; see above.
        }
    }
}

flutter {
    source = "../.."
}

// Without this, a std release build with no key.properties would silently produce an
// unsigned apk. Only checked when actually building std release, so that fdroid and
// debug builds still work without a key. Reads the flavor's signing config rather than
// key.properties directly, so pointing std at signingConfigs.debug also satisfies it.
tasks.matching { it.name == "preStdReleaseBuild" }.configureEach {
    doFirst {
        if (android.productFlavors.std.signingConfig == null) {
            throw new GradleException(
                    "No signing config for the std release build. Create android/key.properties " +
                    "with storeFile/storePassword/keyAlias/keyPassword, or build the unsigned " +
                    "fdroid flavor instead.")
        }
    }
}
